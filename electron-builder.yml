appId: com.treenote.app
productName: TreeNote
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
# Harden the packaged Electron binary (build-time fuses).
# Keep grantFileProtocolExtraPrivileges enabled — production loads the
# renderer via loadFile (file://).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: true
win:
  target: [nsis, portable]
  icon: resources/icon.ico
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TreeNote
  include: resources/installer/path-env.nsh
mac:
  target: [dmg]
  icon: resources/icon.icns
linux:
  target: [AppImage, deb]
  icon: resources/icon.png
  desktop:
    entry:
      StartupWMClass: com.treenote.app
