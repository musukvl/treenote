appId: com.treenote.app
productName: TreeNote
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
win:
  target: [nsis, portable]
  icon: resources/icon.ico
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TreeNote
  include: resources/installer/path-env.nsh
mac:
  target: [dmg]
  icon: resources/icon.icns
linux:
  target: [AppImage, deb]
  icon: resources/icon.png
